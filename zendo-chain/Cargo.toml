[package]
name = "zendo-chain"
version = "0.9.0"
edition = "2021"
description = "Zendo single-writer chain core: synthetics, fees, and read-only oracles"
license = "MIT"

[[bin]]
name = "zendo-chain"
path = "cli/src/main.rs"

[dependencies]
hex = "=0.4.3"
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"
sha2 = "=0.10.8"
