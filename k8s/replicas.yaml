# Regions serve the same app from a copy of the ledger. Writes go to the primary.
# kubectl create secret generic zendo-fleet --from-literal=secret='replace-this'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zendo-region
  labels:
    app: zendo-region
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zendo-region
  template:
    metadata:
      labels:
        app: zendo-region
    spec:
      containers:
        - name: zendo
          image: zendo:local
          ports:
            - containerPort: 38471
          env:
            - name: NODE_ENV
              value: production
            - name: ZENDO_ROLE
              value: replica
            # Optional writer: ZENDO_DATABASE_URL. Optional reader: ZENDO_DATABASE_REPLICA_URL.
            # Optional cache: ZENDO_REDIS_URL (Valkey or Redis). Leave them unset to keep the local copy.
            - name: ZENDO_PRIMARY_URL
              value: http://zendo.default.svc.cluster.local
            - name: ZENDO_FLEET_SECRET
              valueFrom:
                secretKeyRef:
                  name: zendo-fleet
                  key: secret
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: zendo-region
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: zendo-region
  minReplicas: 2
  maxReplicas: 1000
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
