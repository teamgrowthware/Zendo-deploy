apiVersion: apps/v1
kind: Deployment
metadata:
  name: zendo-gateway
  labels:
    app: zendo-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zendo-gateway
  template:
    metadata:
      labels:
        app: zendo-gateway
    spec:
      containers:
        - name: zendo
          image: zendo:local
          ports:
            - containerPort: 38471
          env:
            - name: NODE_ENV
              value: production
            - name: ZENDO_ROLE
              value: gateway
            - name: ZENDO_SHARD_COUNT
              value: "2"
            - name: ZENDO_SHARD_URLS
              value: http://zendo-shard-0.zendo-shard:38471,http://zendo-shard-1.zendo-shard:38471
          readinessProbe:
            httpGet:
              path: /api/health
              port: 38471
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: zendo-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: zendo-gateway
  minReplicas: 2
  maxReplicas: 1000
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
---
apiVersion: v1
kind: Service
metadata:
  name: zendo-gateway
spec:
  selector:
    app: zendo-gateway
  ports:
    - port: 80
      targetPort: 38471
