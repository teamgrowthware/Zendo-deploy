plugins {
    id "com.android.application"
}

// The demo is packaged entirely from src/demo/assets.  Do not bake a remote
// placeholder host into any APK: a live node URL must be supplied explicitly.
def nodeUrl = System.getenv("ZENDO_NODE_URL") ?: ""
def playStore = System.getenv("ZENDO_STORE_FILE") ?: ""

android {
    namespace "app.zendo.phone"
    compileSdk 35

    defaultConfig {
        applicationId "app.zendo.phone"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "1.1.0"
        resValue "string", "default_url", nodeUrl
    }

    signingConfigs {
        if (playStore) {
            play {
                storeFile file(playStore)
                storePassword System.getenv("ZENDO_STORE_PASSWORD")
                keyAlias System.getenv("ZENDO_KEY_ALIAS")
                keyPassword System.getenv("ZENDO_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        demo {
            initWith debug
            applicationIdSuffix ".demo"
            minifyEnabled false
        }
        // A hosted investor build intentionally has no bundled www assets. It
        // may only be assembled when ZENDO_NODE_URL names the approved HTTPS
        // origin, which makes the WebView and /api routes same-origin.
        hostedDemo {
            initWith release
            applicationIdSuffix ".investor"
            matchingFallbacks = ["release"]
            minifyEnabled false
        }
        release {
            signingConfig playStore ? signingConfigs.play : signingConfigs.debug
            minifyEnabled false
        }
        play {
            initWith release
            matchingFallbacks = ["release"]
            if (playStore) {
                signingConfig signingConfigs.play
            } else {
                signingConfig null
            }
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register("validateDemoAssets", Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine "node", "scripts/validate-android-assets.mjs"
}

tasks.register("validateHostedOrigin", Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine "node", "scripts/verify-hosted-android-config.mjs"
}

// A demo APK must never be assembled from an HTML/static-asset mismatch.
tasks.configureEach {
    if (name == "preDemoBuild") {
        dependsOn tasks.named("validateDemoAssets")
    }
    if (name == "preHostedDemoBuild") {
        dependsOn tasks.named("validateHostedOrigin")
    }
}
