services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: zendo
      POSTGRES_PASSWORD: zendo
      POSTGRES_DB: zendo
    volumes:
      - zendo-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zendo -d zendo"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: valkey/valkey:8
    restart: unless-stopped
  zendo:
    build: .
    ports:
      - "38471:38471"
    environment:
      NODE_ENV: production
      ZENDO_SECURE_COOKIES: "1"
      ZENDO_DATABASE_URL: postgres://zendo:zendo@postgres:5432/zendo
      ZENDO_REDIS_URL: redis://redis:6379
    volumes:
      - zendo-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:38471/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
volumes:
  zendo-data: {}
  zendo-pg: {}
